# .github/workflows/pipeline.yml
# CI/CD Pipeline — MLOps Renovacion de Prestamo Sinhue
# Se activa con: push a main o pull_request a main

name: ML Pipeline CI/CD

on:
  push:
    branches:
      - main
      - v*.*.*
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  IMAGE_NAME: renovacion_prestamo-image
  IMAGE_VERSION: '1.0.0'
  DOCKER_FASTAPI_NAME: 'renovacion_prestamo-api'
  COMPOSE_FILE: compose.yml
  DOCKER_MLFLOW_NAME: renovacion_prestamo-mlflow
  MLFLOW_TRACKING_URI_DOCKER: http://0.0.0.0:5000
  APP_NETWORK_NAME: renovacion_prestamo-net
  MLFLOW_TRACKING_URI: http://127.0.0.1:5000
  PORT_LOCAL: 8085
  PORT_REMOTE: 8000

jobs:

  # ── JOB 1: Lint y Tests ────────────────────────────────────────────────────
  lint-and-test:
    name: Lint + Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install --no-cache-dir -r requirements.txt

      - name: Linting con flake8
        run: |
          echo '=== Ejecutando flake8 ==='
          flake8 src/ tests/ --config=setup.cfg
          echo 'Linting OK'

      - name: Tests unitarios con pytest
        run: |
          echo '=== Ejecutando pytest ==='
          pytest tests/test_data.py -v -s
          pytest tests/test_model.py -v -s
          pytest tests/test_pipeline.py -v -s

  # ── JOB 2: Entrenar el modelo ──────────────────────────────────────────────
  train-model:
    name: Entrenar Modelo
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      #MLFLOW
      - name: Configurar Variables de Entorno para el Runner y Docker
        run: |
          if [ ! -f .env ]; then
            echo "Creando .env base para Docker Compose..."
            echo "IMAGE_NAME=${{ env.IMAGE_NAME }}" > .env
            echo "IMAGE_VERSION=${{ env.IMAGE_VERSION }}" >> .env
            echo "DOCKER_FASTAPI_NAME=${{ env.DOCKER_FASTAPI_NAME }}" >> .env
            echo "DOCKER_MLFLOW_NAME=${{ env.DOCKER_MLFLOW_NAME }}" >> .env
            echo "APP_NETWORK_NAME=${{ env.APP_NETWORK_NAME }}" >> .env
            echo "PORT_LOCAL=${{ env.PORT_LOCAL }}" >> .env
            echo "PORT_REMOTE=${{ env.PORT_REMOTE }}" >> .env
          fi
          echo "MLFLOW_TRACKING_URI_DOCKER=${{ env.MLFLOW_TRACKING_URI_DOCKER }}" >> .env

      - name: Inicializar MLflow Server en Docker
        run: |
          echo "=== Levantando servidor MLflow ==="
          docker compose -f ${{ env.COMPOSE_FILE }} up -d mlflow

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install --no-cache-dir -r requirements.txt
        
      - name: Esperar a que MLflow esté listo (Healthcheck)
        run: |
          echo "Esperando a que MLflow responda en ${{ env.MLFLOW_TRACKING_URI }}..."
          for i in {1..20}; do
            # Intentamos conectar tanto a la raíz como al endpoint de health
            if curl -s ${{ env.MLFLOW_TRACKING_URI }}/health > /dev/null || curl -s ${{ env.MLFLOW_TRACKING_URI }}/ > /dev/null; then
              echo "✓ MLflow está activo y saludable en el puerto 5000."
              exit 0
            fi
            echo "Aún no responde (instalando mlflow en contenedor), esperando 3 segundos... ($i/20)"
            sleep 3
          done
          
          echo "MLflow no respondió a tiempo. Mostrando logs del contenedor para diagnosticar:"
          docker logs ${{ env.DOCKER_MLFLOW_NAME }}
          exit 1

      - name: Generar dataset
        run: python src/manage_data.py

      - name: Entrenar pipeline
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_EXPERIMENT: renovacion_prestamo-sinhue
        run: python src/train_model.py

      - name: Validar métricas (quality gate)
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_EXPERIMENT: renovacion_prestamo-sinhue
        run: python src/validate_model.py

      - name: Guardar artefactos del modelo
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/
          retention-days: 7
          
      - name: Apagar infraestructura de MLflow
        if: always()
        run: docker compose -f ${{ env.COMPOSE_FILE }} down

  # ── JOB 3: Build Docker ────────────────────────────────────────────────────
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: train-model
    steps:
      - uses: actions/checkout@v4

      - name: Descargar artefactos del modelo
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/

      - name: Build de la imagen Docker
        run: |
          docker build \
            --build-arg APP_VERSION=${{ env.IMAGE_VERSION }} \
            --build-arg PORT_LOCAL=${{ env.PORT_LOCAL }} \
            --build-arg PORT_REMOTE=${{ env.PORT_REMOTE }} \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}

      - name: Verificar imagen (smoke test corregido)
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }} python -c "
          import pickle
          import sklearn
          try:
              import xgboost
          except ImportError:
              pass
          import os
          path = 'artifacts/model.pkl'
          if os.path.exists(path):
              m = pickle.load(open(path, 'rb'))
              print('✓ Modelo cargado correctamente en Docker:', type(m).__name__)
          else:
              print(' Error: El archivo del modelo no se encuentra dentro del contenedor.')
              exit(1)
          "